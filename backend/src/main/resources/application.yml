server:
  # Render asigna el puerto por variable de entorno; en desarrollo queda el 8080 de siempre.
  port: ${PORT:8080}

spring:
  application:
    name: urbandelivery-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urbandelivery}
    username: ${DB_USER:urbandelivery}
    password: ${DB_PASSWORD:urbandelivery}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo maneja Flyway; Hibernate solo verifica que las entidades coincidan.
      ddl-auto: validate
  flyway:
    # Por defecto (desarrollo y demo académica) se cargan también los datos y cuentas de prueba de db/demo.
    # Producción real: FLYWAY_LOCATIONS=classpath:db/migration (solo esquema, sin cuentas públicas).
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}
  web:
    # Mensajes de validación en español, sin depender del Accept-Language del navegador
    locale: es
    locale-resolver: fixed

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars}
    ttl: 8h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
