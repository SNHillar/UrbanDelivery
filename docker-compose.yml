services:
  db:
    image: postgres:16-alpine
    container_name: urbandelivery-db
    environment:
      POSTGRES_DB: urbandelivery
      POSTGRES_USER: urbandelivery
      POSTGRES_PASSWORD: urbandelivery
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbandelivery -d urbandelivery"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
